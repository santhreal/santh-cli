[package]
name = "santh-cli"
version = "0.1.3"
description = "Shared CLI building blocks for Santh tools: flag parsing, config loading, and finding output with terminal escaping"
authors = ["Santh <64453045+santhreal@users.noreply.github.com>"]
keywords = ["cli", "output", "sarif", "findings"]
homepage = "https://santh.dev"
repository = "https://github.com/santhreal/santh-cli"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[dependencies]
clap = { version = "4.6.0", features = ["derive"] }
ctrlc = { version = "3.5.2" }
secfinding = { version = "0.4.1" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149" }
santh-tracing = { version = "0.2.1" }
thiserror = { version = "2.0.18" }
toml = { version = "0.8.23" }
tracing = { version = "0.1.44" }

[dev-dependencies]
proptest = { version = "1.9.0" }
tempfile = { version = "3.27.0" }

[package.metadata.santh]
status = "beta"
