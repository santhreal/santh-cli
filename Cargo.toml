[package]
name = "santh-cli"
version = "0.1.4"
description = "Shared CLI building blocks for Santh tools: flag parsing, config loading, and finding output with terminal escaping"
authors = ["Santh <64453045+santhreal@users.noreply.github.com>"]
keywords = ["cli", "output", "sarif", "findings"]
homepage = "https://santh.dev"
repository = "https://github.com/santhreal/santh-cli"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[dependencies]
clap = { workspace = true, features = ["derive"] }
ctrlc = { workspace = true }
secfinding = { path = "../../scanner/secfinding", version = "0.4.1" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
santh-tracing = { path = "../santh-tracing", version = "0.2.1" }
thiserror = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
tempfile = { workspace = true }

[package.metadata.santh]
status = "beta"
